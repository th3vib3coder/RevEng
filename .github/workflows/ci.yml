name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-2025-vs2026 ]
        python-version: [ "3.10", "3.12" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Byte-compile all scripts
        run: python -m compileall -q scripts
      - name: Run golden evaluations
        run: python scripts/run_golden_evals.py --json-out evals/golden-summary.json
      - name: Validate manifests parse and stay version-synced
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          codex = json.loads(pathlib.Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          claude = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          assert codex["name"] == claude["name"] == "reverse-engineering", "manifest name mismatch"
          assert codex.get("version") == claude.get("version"), f"version drift: {codex.get('version')} vs {claude.get('version')}"
          print("manifests OK:", codex["name"], codex.get("version"))
          PY
